services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      # 生产部署务必改成随机长串：APP_SECRET_KEY=xxx docker compose up
      APP_SECRET_KEY: ${APP_SECRET_KEY:-please-change-me-in-production}
      LEDGER_DB: /data/ledger.db
      # 汇总构建每块之间的停顿（毫秒），便于观察构建过程；置 0 则全速构建
      SUMMARY_BUILD_DELAY_MS: ${SUMMARY_BUILD_DELAY_MS:-200}
    volumes:
      - ledger-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/')"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  ledger-data:
