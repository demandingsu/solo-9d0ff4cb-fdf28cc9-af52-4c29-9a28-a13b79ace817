<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}苹果箱数核对平台{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header>
  <h1>苹果箱数核对平台</h1>
  <nav>
    <a href="{{ url_for('main.index') }}">总览</a>
    <a href="{{ url_for('main.upload') }}">上传台账</a>
    <a href="{{ url_for('main.packages') }}">核对包</a>
    <a href="{{ url_for('main.verify') }}">市场核对</a>
  </nav>
</header>
<main>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
<footer>合作社内部台账 · 核对包仅含去向与箱数汇总</footer>
</body>
</html>
